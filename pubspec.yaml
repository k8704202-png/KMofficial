name: nexus
description: Nexus - a multi-protocol anti-censorship client for Android and Windows.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Utilities
  crypto: ^3.0.5
  intl: ^0.20.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  file_picker: ^8.1.2

  # Desktop shell (Windows tray icon and window control)
  tray_manager: ^0.2.4
  window_manager: ^0.4.3

  # UI
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
